<style>
.bg-aurora{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%}
body{height:100vh;height:100dvh;display:flex;overflow:hidden;position:relative;background:#0a0a0c;color:#fff}
body.auth-loading .sidebar,body.auth-loading .profile-topbar{opacity:0;pointer-events:none}
.offline-banner{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:998;height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s}
.offline-banner.show{opacity:1}
.offline-banner svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.offline-banner.is-offline{background:rgba(255,59,48,.14);border:1px solid rgba(255,59,48,.35);color:#ffb3ad}
.offline-banner.is-online{background:rgba(52,199,89,.14);border:1px solid rgba(52,199,89,.35);color:#a0e8b4}
.header-typing{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:997;height:30px;display:none;align-items:center;gap:5px;padding:0 14px;border-radius:999px;background:#1a1a1d;border:1px solid rgba(10,132,255,.4);pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.header-typing.show{display:inline-flex}
.header-typing span{width:6px;height:6px;border-radius:50%;background:#0a84ff;display:block;animation:hdrTyping 1.4s ease-in-out infinite}
.header-typing span:nth-child(2){animation-delay:.2s}
.header-typing span:nth-child(3){animation-delay:.4s}
@keyframes hdrTyping{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
body.sidebar-open .offline-banner,body.sidebar-open .header-typing{display:none!important}
.auth-loading-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:24px;background:#0a0a0c}
.auth-loading-overlay.show{display:flex}
.auth-loading-spinner{width:90px;height:90px;position:relative;display:flex;align-items:center;justify-content:center}
.auth-loading-ring{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:var(--accent);border-right-color:var(--accent);animation:authSpin .9s linear infinite}
.auth-loading-ring.ring-2{inset:8px;animation-duration:1.4s;animation-direction:reverse}
@keyframes authSpin{to{transform:rotate(360deg)}}
.auth-loading-logo{width:62px;height:62px}
.auth-loading-logo img{width:100%;height:100%;object-fit:contain}
.auth-loading-text{font-size:13.5px;font-weight:700;color:#fff;opacity:.85}
.error-overlay{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.85)}
.error-overlay.show{display:flex}
.error-box{max-width:600px;padding:22px;border-radius:18px;background:#1a1010;border:1px solid rgba(255,80,80,.5);color:#fff;font-family:monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:80vh;overflow:auto}
.error-box h3{margin:0 0 10px;font-size:14px;color:#ff6b6b}
.error-box button{margin-top:14px;padding:8px 16px;border-radius:10px;background:#ff3b30;color:#fff;border:none;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.profile-topbar{position:fixed;top:0;left:0;right:0;z-index:999;height:52px;margin:10px 14px 0;padding:0 6px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:16px;background:#141417;border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.profile-topbar-title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px;font-weight:800;color:#fff;pointer-events:none;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.back-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:transparent;border:none;cursor:pointer;padding:0;text-decoration:none}
.back-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#headerRight{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-shrink:0}
.header-anon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ffffff;background:transparent;border:1px solid transparent;cursor:pointer;padding:0;transition:transform .2s,color .2s,background .2s,border-color .2s;-webkit-tap-highlight-color:transparent;font-family:inherit}
.header-anon-btn:hover{transform:scale(1.08)}
.header-anon-btn:active{transform:scale(.92)}
.header-anon-btn.active{color:#0a84ff;background:transparent;border-color:transparent}
.header-anon-btn svg{width:36px;height:36px;fill:currentColor;display:block}
.header-empty{width:36px;height:36px;flex-shrink:0}
.login-pill{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);text-decoration:none;flex-shrink:0}
.login-pill svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.skeleton{background:linear-gradient(90deg,#1a1a1d 25%,#222226 50%,#1a1a1d 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sidebar-skeleton{padding:6px 0}
.skeleton-nav{height:10px;width:55px;margin:14px 8px 12px;border-radius:6px}
.skeleton-item{display:flex;align-items:center;gap:8px;padding:12px 10px;margin-bottom:6px;border-radius:12px;background:#141417;border:1px solid rgba(255,255,255,.05)}
.skeleton-line{height:13px;flex:1;max-width:75%}
.sidebar{width:264px;min-width:264px;margin:12px 0 12px 12px;height:calc(100dvh - 24px);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;z-index:40;background:#141417;border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 40px rgba(0,0,0,.6)}
.sidebar-inner{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
.sidebar-top{padding:12px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.logo-area{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:12px;height:52px;border-radius:14px;background:#0f0f12;border:1px solid rgba(255,255,255,.08)}
.brand-logo{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:42px;height:42px;display:grid;place-items:center;transition:opacity .2s}
.brand-logo img{width:100%;height:100%;object-fit:contain}
.brand-name{font-weight:800;font-size:15px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .2s}
.sidebar-search-input{position:absolute;left:6px;right:44px;top:50%;transform:translateY(-50%);height:34px;padding:0 12px;border-radius:10px;background:#0f0f12;border:1px solid rgba(255,255,255,.1);color:#fff;font-size:13px;outline:none;opacity:0;pointer-events:none;transition:opacity .2s}
.sidebar-search-input:focus{border-color:rgba(10,132,255,.5)}
.logo-area.search-mode .brand-logo,.logo-area.search-mode .brand-name{opacity:0;pointer-events:none}
.logo-area.search-mode .sidebar-search-input{opacity:1;pointer-events:auto}
.icon-btn{color:#8a8a92;padding:8px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:none;cursor:pointer;border:none}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#closeSidebarBtn{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
#closeSidebarBtn.clear-mode{color:var(--accent)}
.sidebar-quick-actions{display:flex;align-items:center;justify-content:space-around;gap:4px;padding:8px;border-radius:18px;background:#0f0f12;border:1px solid rgba(255,255,255,.08)}
.sidebar-quick-actions.hidden{display:none}
.qaction{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#8a8a92;background:#1a1a1d;border:1px solid rgba(255,255,255,.08);cursor:pointer;padding:0;text-decoration:none;font-family:inherit}
.qaction svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qaction.new-chat-icon{color:var(--accent)}
.sidebar-scroll{flex:1;overflow-y:auto;padding:10px 10px 14px;min-height:0}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:#4a4a52;padding:10px 6px 6px 8px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.nav-label-text{flex-shrink:0}
.nav-label-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.1),transparent)}
.nav-label.hide-by-search{display:none}
.history-item{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 8px;border-radius:12px;color:#8a8a92;font-size:13px;cursor:pointer;width:100%;text-align:left;margin-bottom:2px;border:1px solid transparent;position:relative}
.history-item:hover{color:#fff;background:#1a1a1d}
.history-item.active{color:#fff;background:rgba(10,132,255,.14);border-color:rgba(10,132,255,.3)}
.history-item.hide-by-search{display:none}
.history-item-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px 0;pointer-events:none}
.history-item-pin-icon{color:var(--accent);width:12px;height:12px;flex-shrink:0}
.history-item-pin-icon svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2}
.history-item.renaming{background:rgba(10,132,255,.12);border-color:var(--accent);cursor:text}
.history-rename-input{flex:1;min-width:0;padding:4px 8px;border-radius:8px;background:#000;border:1px solid var(--accent);color:#fff;font-size:13px;font-family:inherit;outline:none}
.history-more-btn{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6a6a72;background:transparent;border:none;cursor:pointer;padding:0;flex-shrink:0}
.history-more-btn svg{width:16px;height:16px;fill:currentColor}
.sidebar-search-empty{display:none;padding:24px 16px;text-align:center;color:#6a6a72;font-size:12.5px}
.sidebar-search-empty.show{display:block}
.sidebar-empty{padding:24px 16px;text-align:center}
.sidebar-empty-icon{width:48px;height:48px;margin:0 auto 12px;border-radius:14px;background:#0f0f12;border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;color:#6a6a72}
.sidebar-empty-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sidebar-empty-text{font-size:12.5px;color:#6a6a72;line-height:1.5;margin-bottom:14px}
.sidebar-empty-cta{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:700;color:#fff;text-decoration:none;background:#0a84ff;border:1px solid rgba(255,255,255,.2);cursor:pointer}
.sidebar-footer{padding:12px;flex-shrink:0;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:10px}
.account-card{padding:10px;border-radius:18px;background:#0f0f12;border:1px solid rgba(255,255,255,.08)}
.account-row{display:flex;align-items:center;gap:8px}
.account-avatar{width:34px;height:34px;border-radius:50%;background:#0a84ff;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center}
.account-avatar.has-photo{background-image:var(--avatar-url,none);background-color:transparent;font-size:0}
.account-avatar.guest{background:#4b5563}
.account-info{min-width:0;flex:1;overflow:hidden}
.account-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.account-meta{font-size:11px;color:#6a6a72;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-actions-side{display:flex;align-items:center;gap:4px;flex-shrink:0}
.account-gear,.account-logout{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;cursor:pointer;padding:0;text-decoration:none;background:transparent;border:none}
.account-gear{color:#8a8a92}
.account-logout{color:#ff5f57}
.account-gear svg,.account-logout svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.social-box{padding:8px;border-radius:18px;background:#0f0f12;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-around;gap:4px}
.social-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#8a8a92;text-decoration:none;background:#1a1a1d;border:1px solid rgba(255,255,255,.08);font-size:17px}
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;padding-top:72px;min-height:0}
#landing-view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#landing-view.hidden{display:none !important}
.landing-content{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px;width:100%;text-align:center;display:flex;align-items:center;justify-content:center}
.landing-inner{width:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0}
.landing-inner > *{flex-shrink:0}
.landing-brain{width:180px;height:142px;margin:0 auto 28px;color:#0a84ff;display:block}
.landing-brain svg{width:100%;height:100%;overflow:visible;display:block}
.landing-brain .stroke{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.landing-brain .conn{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.landing-brain .node{fill:currentColor}
.landing-byline{font-size:17px;font-weight:800;color:#8a8a92;display:inline-flex;align-items:center;justify-content:center;margin-top:0}
.landing-byline .by-text{color:#8a8a92;font-weight:600;opacity:.75}
.landing-byline #typedAuthor{color:#0a84ff;font-weight:800}
.landing-byline .caret{display:inline-block;width:2.5px;height:1em;background:#0a84ff;margin-left:3px;vertical-align:-.08em;animation:caretBlink .9s steps(2) infinite;border-radius:1px}
@keyframes caretBlink{0%,50%{opacity:1}51%,100%{opacity:0}}
.landing-input-area{padding:12px 16px 18px;flex-shrink:0;position:relative;width:100%}
.landing-input-area .input-box{max-width:820px;margin:0 auto}
.input-box{width:100%;padding:12px 14px 10px;border-radius:24px;display:flex;flex-direction:column;background:#1a1a1d;border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 24px rgba(0,0,0,.4);position:relative}
.input-box textarea{width:100%;background:transparent;border:none;color:#fff;font-size:15px;resize:none;min-height:44px;max-height:140px;outline:none;line-height:1.5;padding:4px 4px 0;font-family:inherit}
.input-box textarea::placeholder{color:#6a6a72}
.pending-preview{display:none;margin-bottom:10px;position:relative}
.pending-preview.show{display:block}
.pending-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.pending-cell{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:#0f0f12;border:1px solid rgba(10,132,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;flex-shrink:0}
.pending-cell.is-img{padding:0}
.pending-cell-img{width:100%;height:100%;object-fit:cover;display:block}
.pending-cell-icon{color:#0a84ff;width:20px;height:20px;margin-bottom:2px}
.pending-cell-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2}
.pending-cell-name{font-size:7.5px;color:#8a8a92;text-align:center;line-height:1.1;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.pending-cell-remove{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.72);color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer;padding:0;z-index:2}
.pending-cell-remove svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round}
.input-footer{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap}
.input-tools{display:flex;gap:10px;align-items:center;position:relative;flex-wrap:wrap}
.attach-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#8a8a92;background:#0f0f12;border:1px solid rgba(255,255,255,.08);cursor:pointer;padding:0;flex-shrink:0}
.attach-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.attach-menu{position:absolute;bottom:calc(100% + 12px);left:0;min-width:200px;padding:6px;border-radius:18px;background:#1a1a1d;border:1px solid rgba(255,255,255,.08);box-shadow:0 16px 40px rgba(0,0,0,.7);opacity:0;transform:translateY(12px) scale(.92);transform-origin:bottom left;pointer-events:none;transition:opacity .28s,transform .36s;z-index:100;overflow:hidden}
.attach-menu.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.attach-item{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:#fff;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;border:none;text-align:left}
.attach-item:hover{background:#222226}
.attach-item-icon{width:22px;height:22px;color:#0a84ff}
.attach-item-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.attach-item-icon.support{color:#ff9500}
.attach-item-text{flex:1;font-size:13.5px;font-weight:600}
.send-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.send-btn{width:38px;height:38px;border-radius:50%;background:#0a84ff;color:#fff;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.15);cursor:pointer;padding:0;flex-shrink:0}
.send-btn:disabled{background:#222226;color:#4a4a52;cursor:not-allowed}
.send-btn svg{width:16px;height:16px;stroke-width:2.5;fill:none;stroke:currentColor;stroke-linecap:round}
.model-btn{height:32px;padding:0 10px;border-radius:16px;display:flex;align-items:center;gap:6px;color:#8a8a92;background:#0f0f12;border:1px solid rgba(255,255,255,.08);cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;flex-shrink:0;max-width:150px}
.model-btn-icon{font-size:15px;flex-shrink:0}
.model-btn-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-btn-caret{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.5;flex-shrink:0}
.scroll-bottom-btn{position:absolute;bottom:100%;right:16px;margin-bottom:12px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1a1a1d;border:1px solid rgba(255,255,255,.1);color:#8a8a92;cursor:pointer;padding:0;opacity:0;pointer-events:none;transform:translateY(8px) scale(.9);transition:opacity .25s,transform .3s;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.scroll-bottom-btn.show{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.scroll-bottom-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
.scroll-bottom-btn.is-streaming{color:#0a84ff;border-color:rgba(10,132,255,.4)}
.scroll-bottom-btn.is-streaming::before{content:"";position:absolute;inset:3px;border-radius:50%;border:2px solid transparent;border-top-color:#0a84ff;border-right-color:#0a84ff;animation:scrollSpin 1s linear infinite;pointer-events:none}
@keyframes scrollSpin{to{transform:rotate(360deg)}}
#chat-view{flex:1;flex-direction:column;overflow:hidden;display:none;min-height:0}
#chat-view.active{display:flex}
.chat-messages{flex:1;overflow-y:auto;padding:12px 10px;min-height:0}
.msg-container{max-width:100%;margin:0;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;flex-direction:column}

function subscribeChats(uid) {
  if (state.unsubChats) { state.unsubChats(); state.unsubChats = null; }
  var q = query(collection(db, 'users', uid, 'chats'), orderBy('createdAt', 'desc'));
  state.unsubChats = onSnapshot(q, function(snap){
    state.chats = [];

      var data = d.data() || {};
      var createdMs = data.createdAt ? (typeof data.createdAt.toMillis === 'function' ? data.createdAt.toMillis() : (data.createdAt instanceof Date ? data.createdAt.getTime() : data.createdAt)) : Date.now();
      var updatedMs = data.updatedAt ? (typeof data.updatedAt.toMillis === 'function' ? data.updatedAt.toMillis() : (data.updatedAt instanceof Date ? data.updatedAt.getTime() : data.updatedAt)) : createdMs;
      state.chats.push({ id: d.id, title: data.title || 'New chat', createdAt: createdMs, updatedAt: updatedMs, isPinned: !!data.isPinned, messages: data.messages || [] });
    });
    state.chats.sort(function(a, b){
      if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    });

function subscribeMessages(uid, chatId) {
  if (state.unsubMessages) { state.unsubMessages(); state.unsubMessages = null; }
  if (!chatId) return;
  if (state.isAnonymous) return;
  var q = query(collection(db, 'users', uid, 'chats', chatId, 'messages'), orderBy('createdAt', 'asc'));
  state.unsubMessages = onSnapshot(q, function(snap){
    var chat = state.chats.find(function(c){ return c.id === chatId; });
    if (!chat) return;
    var remoteMsgs = [];
    snap.forEach(function(d){
      var data = d.data() || {};
      remoteMsgs.push({ role: data.role, text: data.text || '', files: data.files || (data.file ? [data.file] : []), timestamp: data.timestamp || Date.now(), clientId: data.clientId || '' });
    });
    var seenClientIds = {}, seenTimestamps = {};
    chat.messages.forEach(function(m){
      if (m.clientId) seenClientIds[m.clientId] = true;
      if (m.timestamp) seenTimestamps[m.timestamp + '_' + m.role] = true;
    });
    var added = false;
    remoteMsgs.forEach(function(rm){
      if (rm.clientId && seenClientIds[rm.clientId]) return;
      var tsKey = rm.timestamp + '_' + rm.role;
      if (!rm.clientId && seenTimestamps[tsKey]) return;
      chat.messages.push(rm);
      seenClientIds[rm.clientId] = true;
      seenTimestamps[tsKey] = true;
      added = true;
    });
    if (added && state.activeChatId === chatId && !state.isStreaming && !state.isAnonymous) renderMessages();
  }, function(err){});
}

async function pushMessageRemote(chatId, role, text, files, ts, clientId) {
  if (state.isAnonymous) return;
  if (!chatId || String(chatId).indexOf('anon_') === 0) return;
  if (!state.user) return;
  try {
    var msgRef = doc(collection(db, 'users', state.user.uid, 'chats', chatId, 'messages'));
    var payload = { role: role, text: text, createdAt: new Date(), timestamp: ts || Date.now(), clientId: clientId || '' };
    if (files && files.length) {
      payload.files = files.map(function(f){
        var fp = { name: f.name, type: f.type, size: f.size };
        if (f.dataUrl && f.dataUrl.length < 900 * 1024) fp.dataUrl = f.dataUrl;
        return fp;
      });
    }
    await setDoc(msgRef, payload);
    try { await updateDoc(doc(db, 'users', state.user.uid, 'chats', chatId), { updatedAt: new Date() }); } catch (_) {}
    var c = state.chats.find(function(x){ return x.id === chatId; });
    if (c) c.updatedAt = Date.now();
    state.chats.sort(function(a, b){
      if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    });
    try { renderHistory(); } catch (_) {}
  } catch (e) {}
}

function getActiveChat() {

function isChatPending(chat) {
  if (!chat || !chat.messages || !chat.messages.length) return false;
  var hasUserMsg = false, hasAISuccess = false;
  chat.messages.forEach(function(m){
    if (m.role === 'user') hasUserMsg = true;
    if (m.role === 'ai' && !m._error && m.text && m.text.length > 0) hasAISuccess = true;
  });
  return hasUserMsg && !hasAISuccess;
}

async function cleanupPendingChat() {

}

function generateShortTitle(text) {

  var words = text.toLowerCase().replace(/[^\w\s]/g, ' ').split(/\s+/).filter(function(w){ return w.length > 2 && !STOP_WORDS.has(w); });
  if (words.length === 0) { var fb = text.trim().slice(0, 25); return fb + (text.length > 25 ? '...' : ''); }

function getDateLabel(ms) {

  return d.getDate() + ' ' + INDO_MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}

function buildBubbleContent(bubble, m) {
  var hasText = m.text && m.text.trim();
  var files = m.files || (m.file ? [m.file] : []);
  if (files.length) {
    if (files.length > 1) {
      var strip = document.createElement('div'); strip.className = 'msg-attach-strip';
      files.forEach(function(f){
        var cell = document.createElement('div');
        var isImage = f.dataUrl && f.type && f.type.indexOf('image/') === 0;
        cell.className = 'msg-attach-cell' + (isImage ? ' is-img' : '');
        if (isImage) {
          var im = document.createElement('img'); im.src = f.dataUrl; im.className = 'msg-attach-cell-img'; im.alt = f.name || '';
          im.addEventListener('click', function(){ openLightbox(f.dataUrl, f.name); });
          cell.appendChild(im);
        } else {
          var inner = document.createElement('div'); inner.className = 'msg-attach-cell-file';
          var sizeKB = f.size ? (f.size / 1024).toFixed(1) + ' KB' : '';
          inner.innerHTML = '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><div class="msg-attach-cell-filename">' + (f.name || 'file') + '</div>' + (sizeKB ? '<div class="msg-attach-cell-filesize">' + sizeKB + '</div>' : '');
          cell.appendChild(inner);
        }
        strip.appendChild(cell);
      });
      bubble.appendChild(strip);
    } else {
      var f1 = files[0];
      var isImage1 = f1.dataUrl && f1.type && f1.type.indexOf('image/') === 0;
      if (isImage1) {
        var img = document.createElement('img'); img.src = f1.dataUrl; img.className = 'msg-image'; img.alt = f1.name || '';
        img.addEventListener('click', function(){ openLightbox(f1.dataUrl, f1.name); });
        bubble.appendChild(img);
      } else {
        var card = document.createElement('div'); card.className = 'msg-file';
        var sizeKB1 = f1.size ? (f1.size / 1024).toFixed(1) + ' KB' : '';
        card.innerHTML = '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><div class="msg-file-info"><div class="msg-file-name">' + (f1.name || 'file') + '</div>' + (sizeKB1 ? '<div class="msg-file-size">' + sizeKB1 + '</div>' : '') + '</div>';
        bubble.appendChild(card);
      }
    }
    if (hasText) { var cap = document.createElement('div'); cap.className = 'msg-caption'; cap.textContent = m.text; bubble.appendChild(cap); }
    return 'file-only';
  }
  renderer.renderMessageRich(bubble, m.text || '');
  return 'text';
}

function fmtTime(ts) {
  try {
    var d = new Date(ts || Date.now());
    var h = d.getHours(); var m = d.getMinutes();
    if (h < 10) h = '0' + h; if (m < 10) m = '0' + m;
    return h + ':' + m;
  } catch (_) { return ''; }
}

function buildMsgActions(msg) {
  if (msg.role !== 'ai') return document.createDocumentFragment();
  var wrap = document.createElement('div'); wrap.className = 'msg-actions';
  var timeEl = document.createElement('span'); timeEl.className = 'msg-action-time'; timeEl.textContent = fmtTime(msg.timestamp);
  wrap.appendChild(timeEl);
  var btnCopy = document.createElement('button');
  btnCopy.className = 'msg-action-btn'; btnCopy.type = 'button'; btnCopy.title = 'Salin';
  btnCopy.innerHTML = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  btnCopy.addEventListener('click', function(e){
    e.stopPropagation();
    var txt = msg.text || ''; if (!txt) { showToast('Tidak ada teks'); return; }
    navigator.clipboard.writeText(txt).then(function(){
      btnCopy.classList.add('copied');
      setTimeout(function(){ btnCopy.classList.remove('copied'); }, 1200);
      showToast('Disalin');
    }).catch(function(){ showToast('Gagal menyalin'); });
  });
  wrap.appendChild(btnCopy);
  var btnRetry = document.createElement('button');
  btnRetry.className = 'msg-action-btn'; btnRetry.type = 'button'; btnRetry.title = 'Coba lagi';
  btnRetry.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/></svg>';
  btnRetry.addEventListener('click', function(e){
    e.stopPropagation();
    if (state.isStreaming) { showToast('Tunggu sampai selesai'); return; }
    btnRetry.classList.add('retrying');
    setTimeout(function(){ btnRetry.classList.remove('retrying'); }, 800);
    retryAIMsg(msg);
  });
  wrap.appendChild(btnRetry);
  var btnShare = document.createElement('button');
  btnShare.className = 'msg-action-btn'; btnShare.type = 'button'; btnShare.title = 'Bagikan';
  btnShare.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>';
  if (!navigator.share) btnShare.style.display = 'none';
  btnShare.addEventListener('click', async function(e){
    e.stopPropagation();
    var txt = msg.text || ''; if (!txt) { showToast('Tidak ada teks'); return; }
    try { await navigator.share({ title: 'Brain Side', text: txt }); }
    catch (err) { if (err && err.name === 'AbortError') return; }
  });
  wrap.appendChild(btnShare);
  return wrap;
}

function retryAIMsg(msgRef) {
  var chat = getActiveChat();
  if (!chat || !msgRef) return;
  var msgIndex = chat.messages.indexOf(msgRef);
  if (msgIndex === -1) { showToast('Pesan sudah tidak ada'); return; }
  if (msgRef.role !== 'ai') return;
  var userIdx = -1;
  for (var i = msgIndex - 1; i >= 0; i--) { if (chat.messages[i].role === 'user') { userIdx = i; break; } }
  if (userIdx === -1) { showToast('Tidak ada pesan user'); return; }
  var userMsg = chat.messages[userIdx];
  chat.messages = chat.messages.slice(0, userIdx + 1);
  renderMessages();
  resumeSend(userMsg.text || '', userMsg.files || []);
}

function renderMessages() {
  var chat = getActiveChat();
  clearEl(chatMessages);
  if (!chat) { showLandingView(); return; }
  if (!chat.messages || !chat.messages.length) {
    if (state.isAnonymous) renderAnonWelcome();
    updateHeaderTitle();
    return;
  }
  var container = document.createElement('div'); container.className = 'msg-container';
  chat.messages.forEach(function(m){
    var msg = document.createElement('div'); msg.className = 'msg ' + m.role;
    var bubble = document.createElement('div'); bubble.className = 'msg-bubble';
    var kind = buildBubbleContent(bubble, m);
    if (kind === 'file-only') msg.classList.add('file-only');
    if (m.files && m.files.length > 1) msg.classList.add('multi-file');
    if (m._error) bubble.classList.add('msg-error');
    msg.appendChild(bubble);
    if (!m._streaming) msg.appendChild(buildMsgActions(m));
    container.appendChild(msg);
  });
  chatMessages.appendChild(container);
  scrollToBottom(true);
  updateHeaderTitle();
}

var lightbox = $('lightbox');
var lightboxImg = $('lightboxImg');
var lightboxCurrentDataUrl = null, lightboxCurrentName = 'image.jpg';
function openLightbox(dataUrl, name) { lightboxCurrentDataUrl = dataUrl; lightboxCurrentName = name || 'image.jpg'; lightboxImg.src = dataUrl; lightbox.classList.add('show'); }
function closeLightbox() { lightbox.classList.remove('show'); lightboxImg.src = ''; lightboxCurrentDataUrl = null; }
$('lightboxBack').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', function(e){ if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && lightbox.classList.contains('show')) closeLightbox(); });
$('lightboxSave').addEventListener('click', function(e){
  e.stopPropagation(); if (!lightboxCurrentDataUrl) return;
  var a = document.createElement('a'); a.href = lightboxCurrentDataUrl; a.download = lightboxCurrentName;
  document.body.appendChild(a); a.click(); safeRemove(a); showToast('Gambar disimpan');
});
$('lightboxShare').addEventListener('click', async function(e){
  e.stopPropagation(); if (!lightboxCurrentDataUrl) return;
  try {
    if (navigator.share && navigator.canShare) {
      var blob = await (await fetch(lightboxCurrentDataUrl)).blob();
      var file = new File([blob], lightboxCurrentName, { type: blob.type || 'image/jpeg' });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: lightboxCurrentName }); return; }
      await navigator.share({ title: lightboxCurrentName, url: lightboxCurrentDataUrl }); return;
    }
    if (navigator.clipboard) { await navigator.clipboard.writeText(lightboxCurrentDataUrl); showToast('Data gambar dicopy'); return; }
    showToast('Share tidak didukung');
  } catch (err) { if (err && err.name === 'AbortError') return; showToast('Gagal membagikan'); }
});

function renderPendingPreview() {
  var isLanding = state.mode === 'landing' && !state.isAnonymous;
  var previewEl = isLanding ? $('landingPendingPreview') : $('chatPendingPreview');
  var stripEl = isLanding ? $('landingPreviewStrip') : $('chatPreviewStrip');
  var other = isLanding ? $('chatPendingPreview') : $('landingPendingPreview');
  if (other) other.classList.remove('show');
  if (!state.pendingFiles.length) { previewEl.classList.remove('show'); return; }
  clearEl(stripEl);
  state.pendingFiles.forEach(function(item, idx){
    var cell = document.createElement('div');
    cell.className = 'pending-cell' + (item.dataUrl ? ' is-img' : '');
    if (item.dataUrl) {
      var img = document.createElement('img'); img.src = item.dataUrl; img.className = 'pending-cell-img'; img.alt = item.name;
      cell.appendChild(img);
    } else {
      var icon = document.createElement('div'); icon.className = 'pending-cell-icon';
      icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
      cell.appendChild(icon);
      var nm = document.createElement('div'); nm.className = 'pending-cell-name'; nm.textContent = item.name;
      cell.appendChild(nm);
    }
    var rm = document.createElement('button');
    rm.className = 'pending-cell-remove'; rm.type = 'button';
    rm.innerHTML = '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    rm.addEventListener('click', function(e){ e.stopPropagation(); state.pendingFiles.splice(idx, 1); renderPendingPreview(); updateSendBtns(); });
    cell.appendChild(rm);
    stripEl.appendChild(cell);
  });
  previewEl.classList.add('show');
}

function buildAIInput(userText) {
  var parts = [];
  if (state.instructions && state.instructions.trim()) parts.push('[INSTRUKSI KHUSUS]\n' + state.instructions.trim());
  if (state.memory && state.memory.trim()) parts.push('[MEMORI]\n' + state.memory.trim());
  if (parts.length) { parts.push('[PESAN USER]\n' + userText); return parts.join('\n\n'); }
  return userText;
}

function createTypingIndicator(reqId) {
  var msg = document.createElement('div');
  msg.className = 'msg ai'; msg.dataset.role = 'typingIndicator'; msg.dataset.reqId = reqId; msg.id = 'typingIndicator-' + reqId;
  var bubble = document.createElement('div'); bubble.className = 'msg-bubble';
  bubble.innerHTML = '<div class="ai-thinking-wrap"><div class="ai-thinking-row">' + BRAIN_SVG_HTML + '</div><div class="ai-cot"><span class="ai-cot-text" data-cot="' + reqId + '"></span></div></div>';
  msg.appendChild(bubble);
  return msg;
}
function removeTypingIndicator(reqId) { var el = document.getElementById('typingIndicator-' + reqId); if (el) safeRemove(el); }
function removeAllTypingIndicators() { document.querySelectorAll('[data-role="typingIndicator"]').forEach(function(el){ safeRemove(el); }); }

function startCOT(reqId, userText) {
  stopCOT();
  var el = document.querySelector('[data-cot="' + reqId + '"]');
  if (!el) return;
  var statuses = buildCOTStatuses(userText);
  var idx = 0;
  el.textContent = statuses[0];
  el.classList.remove('fade-out');
  state.cotTimer = setInterval(function() {
    var elNow = document.querySelector('[data-cot="' + reqId + '"]');
    if (!elNow) { stopCOT(); return; }
    idx = (idx + 1) % statuses.length;
    elNow.classList.add('fade-out');
    setTimeout(function(){
      var e2 = document.querySelector('[data-cot="' + reqId + '"]');
      if (!e2) return;
      e2.textContent = statuses[idx];
      e2.classList.remove('fade-out');
    }, 280);
  }, 2000);
}
function stopCOT() { if (state.cotTimer) { clearInterval(state.cotTimer); state.cotTimer = null; } }

function renderAIBubble(aiEl, aiBubble, reply, isErr, aiMsg) {
  if (isErr) {
    aiBubble.classList.add('msg-error');
    aiBubble.textContent = reply;
    aiEl.appendChild(buildMsgActions(aiMsg));
    return Promise.resolve();
  }
  if (typeof renderer.renderWithResumeBtn !== 'function') {
    aiBubble.textContent = reply;
    aiEl.appendChild(buildMsgActions(aiMsg));
    return Promise.resolve();
  }
  return renderer.renderWithResumeBtn({
    aiEl: aiEl, aiBubble: aiBubble, fullText: reply,
    onNewCtrl: function (ctrl) { state.streamCtrl = ctrl; },
    onComplete: function () { aiEl.appendChild(buildMsgActions(aiMsg)); }
  });
}

function showResumeButton(opts) {
  stopCOT(); removeAllTypingIndicators();
  var oldBtn = document.getElementById('resumeBtnWrap');
  if (oldBtn) safeRemove(oldBtn);
  if (headerTyping) headerTyping.classList.remove('show');
  state.pendingResume = { chatId: opts.chatId, text: opts.text, filesSnapshot: opts.filesSnapshot, userTs: opts.userTs, clientId: opts.clientId, chatIsLocal: opts.chatIsLocal, userPushed: opts.userPushed, isAnonymous: opts.isAnonymous };
  var container = chatMessages.querySelector('.msg-container');
  if (!container) { container = document.createElement('div'); container.className = 'msg-container'; chatMessages.appendChild(container); }
  var btnWrap = document.createElement('div');
  btnWrap.className = 'msg ai'; btnWrap.id = 'resumeBtnWrap'; btnWrap.style.marginTop = '0';
  var btn = document.createElement('button');
  btn.className = 'resume-btn-full'; btn.type = 'button'; btn.textContent = 'Lanjutkan';
  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (!navigator.onLine) { showToast('Anda sedang offline'); return; }
    safeRemove(btnWrap);
    var pr = state.pendingResume;
    state.pendingResume = null;
    if (pr) resumePendingRequest(pr);
  });
  btnWrap.appendChild(btn);
  container.appendChild(btnWrap);
  state.isStreaming = false; state.streamCtrl = null;
  updateSendBtns(); updateScrollBtn(); scrollToBottom();
}

async function resumePendingRequest(pr) {
  if (state.isStreaming) return;
  var reqId = generateUUID();
  state.currentRequestId = reqId;
  state.isStreaming = true; state.userAborted = false;
  updateSendBtns(); updateScrollBtn();
  if (state.user && !pr.chatIsLocal && !pr.userPushed && !pr.isAnonymous && !state.isAnonymous) {
    await pushMessageRemote(pr.chatId, 'user', pr.text || '', pr.filesSnapshot, pr.userTs, pr.clientId);
  }
  var container = chatMessages.querySelector('.msg-container');
  if (!container) { container = document.createElement('div'); container.className = 'msg-container'; chatMessages.appendChild(container); }
  var typingMsg = createTypingIndicator(reqId);
  container.appendChild(typingMsg);
  startCOT(reqId, pr.text || '');
  scrollToBottom();
  setTimeout(checkTypingIndicatorVisibility, 100);
  var reply = ''; var isErr = false;
  try {
    var fileNames = (pr.filesSnapshot || []).map(function(f){ return f.name; }).join(', ');
    var rawText = pr.text || (fileNames ? '[' + fileNames + ']' : '');
    var aiText = state.isAnonymous ? rawText : buildAIInput(rawText);
    var convId = getAIConvId(pr.chatId);
    var result = await askAI(aiText, convId, pr.filesSnapshot);
    reply = result.reply;
    if (result.conversationId) setAIConvId(pr.chatId, result.conversationId);
  } catch (err) { reply = 'offline, periksa internet'; isErr = true; }
  if (state.currentRequestId !== reqId || state.userAborted) {
    stopCOT(); removeTypingIndicator(reqId);
    if (headerTyping) headerTyping.classList.remove('show');
    state.isStreaming = false; state.streamCtrl = null; state.userAborted = false;
    updateSendBtns(); updateScrollBtn();
    return;
  }
  stopCOT(); removeTypingIndicator(reqId);
  if (headerTyping) headerTyping.classList.remove('show');
  var tsAI = Date.now();
  var aiClientId = 'ai_' + generateUUID();
  var aiMsg = { role: 'ai', text: reply, timestamp: tsAI, clientId: aiClientId };
  if (isErr) aiMsg._error = true;
  var chat = state.isAnonymous ? state.anonChat : state.chats.find(function(c){ return c.id === pr.chatId; });
  if (chat) {
    chat.messages.push(aiMsg);
    if (state.user && !chat.isLocal && !state.isAnonymous) pushMessageRemote(pr.chatId, 'ai', reply, null, tsAI, aiClientId);
  }
  var aiEl = document.createElement('div'); aiEl.className = 'msg ai';
  var aiBubble = document.createElement('div'); aiBubble.className = 'msg-bubble';
  aiEl.appendChild(aiBubble); container.appendChild(aiEl);
  try { await renderAIBubble(aiEl, aiBubble, reply, isErr, aiMsg); }
  catch (renderErr) { try { aiBubble.textContent = reply; aiEl.appendChild(buildMsgActions(aiMsg)); } catch (_) {} }
  scrollToBottom();
  state.isStreaming = false; state.streamCtrl = null; state.userAborted = false; state.currentRequestId = null;
  updateSendBtns(); updateScrollBtn();
}

async function handleSend(text) {
  if (state.isStreaming) return;
  if (state.pendingResume) {
    var oldBtn = document.getElementById('resumeBtnWrap');
    if (oldBtn) safeRemove(oldBtn);
    state.pendingResume = null;
  }
  text = (text || '').trim();
  if (!text && !state.pendingFiles.length) return;
  if (!state.isAnonymous && requireLogin()) return;
  var filesSnapshot = state.pendingFiles.map(function(f){ return { name: f.name, type: f.type, size: f.size, dataUrl: f.dataUrl }; });
  state.pendingFiles = [];
  renderPendingPreview();
  var chatId, chat;
  if (state.isAnonymous) {
    if (!state.anonChat) {
      state.anonChat = { id: 'anon_' + Date.now(), title: 'Anonymous', messages: [], createdAt: Date.now(), updatedAt: Date.now() };
    }
    chat = state.anonChat;
    chatId = chat.id;
    chat.updatedAt = Date.now();
  } else {
    chatId = state.activeChatId;
    chat = chatId ? state.chats.find(function(c){ return c.id === chatId; }) : null;
    if (!chatId || !chat) {
      chatId = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      var title = text ? generateShortTitle(text) : (filesSnapshot.length ? filesSnapshot[0].name : 'New chat');
      chat = { id: chatId, title: title, createdAt: Date.now(), updatedAt: Date.now(), isPinned: false, messages: [], isLocal: false };
      state.chats.unshift(chat); state.activeChatId = chatId;
      persistActiveChatId(chatId);
      if (state.user) { try { await setDoc(doc(db, 'users', state.user.uid, 'chats', chatId), { title: title, createdAt: new Date(), updatedAt: new Date(), isPinned: false }); } catch (e) { chat.isLocal = true; } }
      else chat.isLocal = true;
      renderHistory();
    } else {
      chat.updatedAt = Date.now();
      if (state.user && !chat.isLocal) { try { await updateDoc(doc(db, 'users', state.user.uid, 'chats', chatId), { updatedAt: new Date() }); } catch (_) {} }
      state.chats.sort(function(a, b){
        if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
        return (b.updatedAt || 0) - (a.updatedAt || 0);
      });
      renderHistory();
    }
  }
  var tsUser = Date.now();
  var userClientId = 'usr_' + generateUUID();
  var userMsg = { role: 'user', text: text || '', timestamp: tsUser, clientId: userClientId };
  if (filesSnapshot.length) userMsg.files = filesSnapshot;
  chat.messages.push(userMsg);
  landingInput.value = ''; chatInput.value = '';
  landingInput.style.height = 'auto'; chatInput.style.height = 'auto';
  updateSendBtns();
  showChatView();
  state.userPinned = true; updateScrollBtn();
  var container = chatMessages.querySelector('.msg-container');
  if (!container) { container = document.createElement('div'); container.className = 'msg-container'; chatMessages.appendChild(container); }
  var userEl = document.createElement('div'); userEl.className = 'msg user';
  var userBubble = document.createElement('div'); userBubble.className = 'msg-bubble';
  var kind = buildBubbleContent(userBubble, userMsg);
  if (kind === 'file-only') userEl.classList.add('file-only');
  if (filesSnapshot.length > 1) userEl.classList.add('multi-file');
  userEl.appendChild(userBubble);
  userEl.appendChild(buildMsgActions(userMsg));
  container.appendChild(userEl);
  if (state.user && !chat.isLocal && !state.isAnonymous) subscribeMessages(state.user.uid, chatId);
  if (!navigator.onLine) {
    showResumeButton({ chatId: chatId, text: text || '', filesSnapshot: filesSnapshot, userTs: tsUser, clientId: userClientId, chatIsLocal: chat.isLocal || false, userPushed: false, isAnonymous: state.isAnonymous });
    return;
  }
  var reqId = generateUUID();
  state.currentRequestId = reqId;
  state.isStreaming = true; state.userAborted = false;
  updateSendBtns(); updateScrollBtn();
  if (state.user && !chat.isLocal && !state.isAnonymous) pushMessageRemote(chatId, 'user', text || '', filesSnapshot, tsUser, userClientId);
  var typingMsg = createTypingIndicator(reqId);
  container.appendChild(typingMsg);
  startCOT(reqId, text || '');
  scrollToBottom();
  setTimeout(checkTypingIndicatorVisibility, 100);
  var reply = ''; var isErr = false;
  try {
    var fileNames = filesSnapshot.map(function(f){ return f.name; }).join(', ');
    var rawText = text || (fileNames ? '[' + fileNames + ']' : '');
    var aiText = state.isAnonymous ? rawText : buildAIInput(rawText);
    var convId = getAIConvId(chatId);
    var result = await askAI(aiText, convId, filesSnapshot);
    reply = result.reply;
    if (result.conversationId) setAIConvId(chatId, result.conversationId);
  } catch (err) { reply = 'offline, periksa internet'; isErr = true; }
  if (state.currentRequestId !== reqId || state.userAborted) {
    stopCOT(); removeTypingIndicator(reqId);
    if (headerTyping) headerTyping.classList.remove('show');
    state.isStreaming = false; state.streamCtrl = null; state.userAborted = false;
    updateSendBtns(); updateScrollBtn();
    return;
  }
  stopCOT(); removeTypingIndicator(reqId);
  if (headerTyping) headerTyping.classList.remove('show');
  var tsAI = Date.now();
  var aiClientId = 'ai_' + generateUUID();
  var aiMsg = { role: 'ai', text: reply, timestamp: tsAI, clientId: aiClientId };
  if (isErr) aiMsg._error = true;
  chat.messages.push(aiMsg);
  if (state.user && !chat.isLocal && !state.isAnonymous) pushMessageRemote(chatId, 'ai', reply, null, tsAI, aiClientId);
  var aiEl = document.createElement('div'); aiEl.className = 'msg ai';
  var aiBubble = document.createElement('div'); aiBubble.className = 'msg-bubble';
  aiEl.appendChild(aiBubble); container.appendChild(aiEl);
  try { await renderAIBubble(aiEl, aiBubble, reply, isErr, aiMsg); }
  catch (renderErr) { try { aiBubble.textContent = reply; aiEl.appendChild(buildMsgActions(aiMsg)); } catch (_) {} }
  scrollToBottom();
  state.isStreaming = false; state.streamCtrl = null; state.userAborted = false; state.currentRequestId = null;
  updateSendBtns(); updateScrollBtn();
}

async function resumeSend(text, files) {
  if (state.isStreaming) return;
  var reqId = generateUUID();
  state.currentRequestId = reqId;
  state.isStreaming = true; state.userAborted = false; state.userPinned = true;
  updateSendBtns(); updateScrollBtn();
  var container = chatMessages.querySelector('.msg-container');
  if (!container) { container = document.createElement('div'); container.className = 'msg-container'; chatMessages.appendChild(container); }
  var typingMsg = createTypingIndicator(reqId);
  container.appendChild(typingMsg);
  startCOT(reqId, text || '');
  scrollToBottom();
  setTimeout(checkTypingIndicatorVisibility, 100);
  var reply = ''; var isErr = false;
  try {
    var fileNames = (files || []).map(function(f){ return f.name; }).join(', ');
    var rawText = text || (fileNames ? '[' + fileNames + ']' : '');
    var aiText = state.isAnonymous ? rawText : buildAIInput(rawText);
    var convId = getAIConvId(state.isAnonymous ? (state.anonChat ? state.anonChat.id : null) : state.activeChatId);
    var result = await askAI(aiText, convId, files);
    reply = result.reply;
    if (result.conversationId) setAIConvId(state.isAnonymous ? (state.anonChat ? state.anonChat.id : null) : state.activeChatId, result.conversationId);
  } catch (err) { reply = 'offline, periksa internet'; isErr = true; }
  if (state.currentRequestId !== reqId || state.userAborted) {
    stopCOT(); removeTypingIndicator(reqId);
    if (headerTyping) headerTyping.classList.remove('show');
    state.isStreaming = false; state.streamCtrl = null; state.userAborted = false;
    updateSendBtns(); updateScrollBtn();
    return;
  }
  stopCOT(); removeTypingIndicator(reqId);
  if (headerTyping) headerTyping.classList.remove('show');
  var tsAI = Date.now();
  var aiClientId = 'ai_' + generateUUID();
  var aiMsg = { role: 'ai', text: reply, timestamp: tsAI, clientId: aiClientId };
  if (isErr) aiMsg._error = true;
  var chat = getActiveChat();
  if (chat) {
    chat.messages.push(aiMsg);
    if (state.user && !chat.isLocal && !state.isAnonymous) pushMessageRemote(chat.id, 'ai', reply, null, tsAI, aiClientId);
  }
  var aiEl = document.createElement('div'); aiEl.className = 'msg ai';
  var aiBubble = document.createElement('div'); aiBubble.className = 'msg-bubble';
  aiEl.appendChild(aiBubble); container.appendChild(aiEl);
  try { await renderAIBubble(aiEl, aiBubble, reply, isErr, aiMsg); }
  catch (renderErr) { try { aiBubble.textContent = reply; aiEl.appendChild(buildMsgActions(aiMsg)); } catch (_) {} }
  scrollToBottom();
  state.isStreaming = false; state.streamCtrl = null; state.userAborted = false; state.currentRequestId = null;
  updateSendBtns(); updateScrollBtn();
}

function updateSendBtns() {
  var lHas = landingInput.value.trim().length > 0 || state.pendingFiles.length > 0;
  var cHas = chatInput.value.trim().length > 0 || state.pendingFiles.length > 0;
  if (state.isStreaming) {
    landingSend.disabled = true; chatSend.disabled = false;
    chatSend.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></svg>';
    return;
  }
  landingSend.innerHTML = '<svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
  chatSend.innerHTML = '<svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
  landingSend.disabled = !lHas;
  chatSend.disabled = !cHas;
}

function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 140) + 'px'; }
[landingInput, chatInput].forEach(function(el){
  el.addEventListener('input', function(){ autoResize(el); updateSendBtns(); });
  el.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!state.isStreaming) handleSend(el.value); } });
});
landingSend.addEventListener('click', function(){ if (state.isStreaming) return; handleSend(landingInput.value); });
chatSend.addEventListener('click', function(){
  if (state.isStreaming) {
    state.userAborted = true; state.currentRequestId = null;
    if (state.streamCtrl) state.streamCtrl.aborted = true;
    removeAllTypingIndicators(); stopCOT();
    if (headerTyping) headerTyping.classList.remove('show');
    state.isStreaming = false; state.streamCtrl = null;
    updateSendBtns(); updateScrollBtn();
    showToast('Dihentikan.');
    return;
  }
  handleSend(chatInput.value);
});

function setupAttachMenu(btnId, menuId) {
  var btn = $(btnId); var menu = $(menuId);
  if (!btn || !menu) return;
  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    var all = document.querySelectorAll('.attach-menu.show');
    for (var i = 0; i < all.length; i++) { if (all[i] !== menu) all[i].classList.remove('show'); }
    var willOpen = !menu.classList.contains('show');
    menu.classList.toggle('show');
    if (willOpen) { try { closeModelSheet(); } catch (_) {} }
  });
  var supports = menu.querySelectorAll('.attach-item[data-attach="support"]');
  for (var i = 0; i < supports.length; i++) {
    supports[i].addEventListener('click', function(e){ e.stopPropagation(); menu.classList.remove('show'); showToast('Support Me - coming soon'); });
  }
  var fileItems = menu.querySelectorAll('.attach-item[data-attach="image"], .attach-item[data-attach="file"]');
  for (var j = 0; j < fileItems.length; j++) {
    fileItems[j].addEventListener('click', function(){ menu.classList.remove('show'); });
  }
}
setupAttachMenu('landingAttachBtn', 'landingAttachMenu');
setupAttachMenu('chatAttachBtn', 'chatAttachMenu');

document.addEventListener('click', function() {
  var all = document.querySelectorAll('.attach-menu.show');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('show');
});

function addSelectedFiles(fileList) {
  var picked = Array.prototype.slice.call(fileList || []);
  if (!picked.length) return;
  var slots = MAX_FILES - state.pendingFiles.length;
  if (slots <= 0) { showToast('Maksimal ' + MAX_FILES + ' file'); return; }
  var use = picked.slice(0, slots);
  use.forEach(function(file) {
    var item = { name: file.name || 'file', type: file.type || 'application/octet-stream', size: file.size || 0, dataUrl: null };
    state.pendingFiles.push(item);
    if (item.type.indexOf('image/') === 0) {
      var reader = new FileReader();
      reader.onload = function(e) { item.dataUrl = e.target && e.target.result ? e.target.result : null; renderPendingPreview(); updateSendBtns(); };
      reader.onerror = function() { renderPendingPreview(); updateSendBtns(); };
      reader.readAsDataURL(file);
    }
  });
  renderPendingPreview(); updateSendBtns();
}

['landingImagePicker','landingFilePicker','chatImagePicker','chatFilePicker'].forEach(function(id){
  var input = $(id);
  if (!input) return;
  input.addEventListener('change', function(){ addSelectedFiles(this.files); this.value = ''; });
});

var qaNewChat = $('qaNewChat'), qaSearch = $('qaSearch');
if (qaNewChat) qaNewChat.addEventListener('click', function(){ doNewChat(); });
if (qaSearch) qaSearch.addEventListener('click', function(){
  if (!state.isAnonymous && requireLogin()) return;
  if (state.searchMode) { sidebarSearchInput.focus(); return; }
  enterSearchMode();
});

async function doNewChat() {
  if (state.isAnonymous) {
    state.anonChat = { id: 'anon_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8), title: 'Anonymous', messages: [], createdAt: Date.now(), updatedAt: Date.now() };
    removeAllTypingIndicators(); stopCOT();
    if (headerTyping) headerTyping.classList.remove('show');
    state.isStreaming = false; state.streamCtrl = null; state.userAborted = false;
    state.currentRequestId = null; state.pendingResume = null; state.pendingFiles = []; state.userPinned = true;
    renderPendingPreview(); renderAnonWelcome(); updateSendBtns(); updateScrollBtn();
    if (window.innerWidth <= 768) closeSidebarFn();
    return;
  }
  if (requireLogin()) return;
  await cleanupPendingChat();
  state.activeChatId = null; state.userPinned = true;
  persistActiveChatId(null);
  state.currentRequestId = null; state.userAborted = false; state.isStreaming = false;
  if (state.unsubMessages) { state.unsubMessages(); state.unsubMessages = null; }
  state.pendingFiles = []; state.pendingResume = null;
  var oldBtn = document.getElementById('resumeBtnWrap');
  if (oldBtn) safeRemove(oldBtn);
  removeAllTypingIndicators(); stopCOT();
  if (headerTyping) headerTyping.classList.remove('show');
  renderPendingPreview(); renderHistory(); showLandingView();
  clearEl(chatMessages); updateHeaderTitle(); updateScrollBtn();
  if (window.innerWidth <= 768) closeSidebarFn();
}

(function typeAuthor() {
  var el = document.getElementById('typedAuthor');
  if (!el) return;
  try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = 'WP septa'; return; } } catch (_) {}
  var FULL = 'WP septa';
  var TYPE_SPEED = 120, ERASE_SPEED = 55, HOLD_MS = 2200;
  function sleep(ms) { return new Promise(function(r){ return setTimeout(r, ms); }); }
  async function type(text) { for (var i = 1; i <= text.length; i++) { el.textContent = text.slice(0, i); await sleep(TYPE_SPEED + Math.random() * 25); } }
  async function erase() { while (el.textContent.length) { el.textContent = el.textContent.slice(0, -1); await sleep(ERASE_SPEED); } }
  (async function loop() { el.textContent = ''; await sleep(700); for (;;) { await type(FULL); await sleep(HOLD_MS); await erase(); await sleep(320); } })();
})();

onAuthStateChanged(auth, async function(user){
  if (state.unsubChats) { state.unsubChats(); state.unsubChats = null; }
  if (state.unsubMessages) { state.unsubMessages(); state.unsubMessages = null; }
  state.user = user;
  if (!user) {
    if (__cachedUser) { __applyUserToUI(__cachedUser); markAuthReady(); renderHeaderRight(); return; }
    state.chats = []; state.activeChatId = null; state.chatsLoaded = true;
    if (userNameEl) userNameEl.textContent = 'Guest';
    if (userEmailEl) userEmailEl.textContent = 'Belum login';
    if (userAvatar) { userAvatar.classList.add('guest'); userAvatar.classList.remove('has-photo'); userAvatar.style.removeProperty('--avatar-url'); userAvatar.textContent = '?'; }
    if (accountActionsSide) accountActionsSide.style.display = 'none';
    markAuthReady(); renderHeaderRight(); return;
  }
  var email = user.email || '';
  var initialName = email.split('@')[0] || 'User';
  state.chatsLoaded = false;
  if (userNameEl) userNameEl.textContent = initialName;
  if (userEmailEl) userEmailEl.textContent = email;
  if (userAvatar) {
    userAvatar.classList.remove('guest');
    if (user.photoURL) { userAvatar.classList.add('has-photo'); userAvatar.style.setProperty('--avatar-url', 'url("' + user.photoURL + '")'); userAvatar.textContent = ''; }
    else { userAvatar.classList.remove('has-photo'); userAvatar.style.removeProperty('--avatar-url'); userAvatar.textContent = (initialName[0] || '?').toUpperCase(); }
  }
  if (accountActionsSide) accountActionsSide.style.display = 'flex';
  markAuthReady(); subscribeChats(user.uid);
  if (!state.modelPickerReady) {
    try {
      var adapter = createAISettingsAdapter(user.uid);
      await initModelPicker({
        adapter: adapter,
        allowedProviders: ['opencode'],
        excludeProviders: [],
        onChange: function(model) { try { updateInputPlaceholder(); } catch (_) {} }
      });
      state.modelPickerReady = true;
      try { updateInputPlaceholder(); } catch (_) {}
    } catch (e) {}
  }
  try {
    var snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists()) {
      var data = snap.data();
      var displayName = data.username || initialName;
      var photoBase64 = data.photoBase64 || user.photoURL || null;
      if (userNameEl) userNameEl.textContent = displayName;
      if (userAvatar) {
        if (photoBase64) { userAvatar.classList.add('has-photo'); userAvatar.style.setProperty('--avatar-url', 'url("' + photoBase64 + '")'); userAvatar.textContent = ''; }
        else { userAvatar.classList.remove('has-photo'); userAvatar.style.removeProperty('--avatar-url'); userAvatar.textContent = (displayName[0] || '?').toUpperCase(); }
      }
      try { sessionStorage.setItem('bs_user_cache', JSON.stringify({ uid: user.uid, email: email, username: displayName, photoBase64: photoBase64 })); } catch (_) {}
      __cachedUser = { uid: user.uid, email: email, username: displayName, photoBase64: photoBase64 };
    }
    var aiSnap = await getDoc(doc(db, 'users', user.uid, 'settings', 'ai'));
    if (aiSnap.exists()) {
      var aiData = aiSnap.data() || {};
      state.instructions = aiData.instructions || '';
      state.memory = aiData.memory || '';
    }
  } catch (e) {}
  renderHeaderRight();
});

function ensureLandingVisible() {
  try {
    var lv = document.getElementById('landing-view');
    if (!lv) return;
    if (!state.activeChatId && state.mode !== 'chat' && !state.isAnonymous) {
      lv.classList.remove('hidden'); lv.style.display = 'flex';
      lv.style.opacity = '1'; lv.style.visibility = 'visible';
    }
    document.body.classList.remove('auth-loading');
    var ov = document.getElementById('authLoadingOverlay');
    if (ov) ov.classList.remove('show');
  } catch (_) {}
}

if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', ensureLandingVisible); } else { ensureLandingVisible(); }
ensureLandingVisible();
setTimeout(ensureLandingVisible, 50);
setTimeout(ensureLandingVisible, 200);
setTimeout(ensureLandingVisible, 500);
setTimeout(ensureLandingVisible, 1200);
window.addEventListener('load', ensureLandingVisible);

try {
  if (__cachedUser) __applyUserToUI(__cachedUser);
  renderHeaderRight(); renderHistory(); updateSendBtns();
  updateHeaderTitle(); updateScrollBtn(); updateInputPlaceholder();
  updateQuickActionsVisibility();
} catch (e) {
  document.body.classList.remove('auth-loading');
  $('authLoadingOverlay').classList.remove('show');
}

window.addEventListener('pagehide', function(){
  persistActiveChatId(state.activeChatId);
});
window.addEventListener('beforeunload', function(){
  persistActiveChatId(state.activeChatId);
});

console.log('[BrainSide] chat.html loaded OK');
